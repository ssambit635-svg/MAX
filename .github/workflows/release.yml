name: Release MAX

# A tag is the only thing that publishes. Pushing to main builds and checks;
# tagging v0.6.0 creates the download page everyone else uses.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (must already exist, e.g. v0.6.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  # Every build here is unsigned: signing keys are the user's to provide.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run qa
      - run: npx electron-builder --win --x64 --publish never
      - run: |
          Get-ChildItem release/ | Format-Table Name, Length
          if (-not (Get-ChildItem release/*.exe)) { Write-Host '::error::no installer'; exit 1 }
          if (-not (Test-Path release/latest.yml)) { Write-Host '::error::no latest.yml for the updater'; exit 1 }
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    # Unsigned and unnotarized; still useful, never a reason to withhold Windows.
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx electron-builder --mac --arm64 --x64 --publish never
      - run: ls -lh release/ && test -n "$(ls release/*.dmg 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/latest-mac.yml
          if-no-files-found: warn

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx electron-builder --linux --x64 --publish never
      - run: ls -lh release/ && test -n "$(ls release/*.AppImage 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            app/release/*.AppImage
            app/release/latest-linux.yml
          if-no-files-found: warn

  publish:
    name: Publish the release
    needs: [windows, macos, linux]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Work out the version and check it matches package.json
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./app/package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION — bump the version or fix the tag"
            exit 1
          fi
          ls -la artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Notes come from the changelog the app itself shows, so the download
          # page and the pet never disagree.
          node - <<'JS' > notes.md
          const fs = require('node:fs');
          const source = fs.readFileSync('app/src/lib/changelog.ts', 'utf8');
          const version = require('./app/package.json').version;
          const block = source.split(`version: "${version}"`)[1] ?? '';
          const title = (block.match(/title: "([^"]+)"/) ?? [])[1] ?? `MAX ${version}`;
          const changes = [...block.split('changes: [')[1].split(']')[0].matchAll(/"([^"]+)"/g)].map((m) => `- ${m[1]}`);
          console.log(`## MAX ${version} — ${title}\n`);
          console.log(changes.join('\n'));
          console.log('\n### Downloads\n');
          console.log('| Platform | File | Notes |');
          console.log('| --- | --- | --- |');
          console.log(`| Windows | \`MAX-${version}-win-x64.exe\` | Installer. SmartScreen will warn because this build is unsigned: **More info → Run anyway**. |`);
          console.log(`| Windows (portable) | \`MAX-${version}-portable.exe\` | No install, no uninstaller. |`);
          console.log(`| macOS | \`MAX-${version}.dmg\` | Apple silicon and Intel. First open: right-click the app → **Open**. |`);
          console.log(`| Linux | \`MAX-${version}.AppImage\` | \`chmod +x\`, then run. |`);
          JS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MAX ${{ steps.meta.outputs.version }}" --notes-file notes.md
          else
            gh release create "$TAG" --title "MAX ${{ steps.meta.outputs.version }}" --notes-file notes.md --verify-tag
          fi
          shopt -s nullglob
          files=(artifacts/*.exe artifacts/*.dmg artifacts/*.zip artifacts/*.AppImage artifacts/*.blockmap artifacts/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::nothing to publish"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
