name: Build MAX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build UI
        run: npx vite build

      - name: Regenerate icons from source
        run: npm run icons

      - name: Integration verification logic
        run: npm run test:integrations

      - name: App allowlist and resolver logic
        run: npm run test:apps

      - name: Code engine rules and file guards
        run: npm run test:code

      - name: Editor syntax highlighting
        run: npm run test:highlight

      - name: Codebase housekeeping (dead CSS, dead exports, dead prefs)
        run: npm run test:codebase

      - name: Snippets, project scan and diagnostics
        run: npm run test:tools

      - name: Smoke-test the local service
        run: |
          node server/index.mjs &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:7999/api/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7999/api/health
          curl -sf http://127.0.0.1:7999/ -o /dev/null -w 'ui %{http_code}\n'
          curl -sf http://127.0.0.1:7999/pet.html -o /dev/null -w 'pet %{http_code}\n'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"stats github"}'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"help"}'
          curl -sf -X POST http://127.0.0.1:7999/api/notes \
            -H 'content-type: application/json' -d '{"text":"ci smoke test"}'
          curl -sf http://127.0.0.1:7999/api/state > /dev/null
          curl -sf http://127.0.0.1:7999/api/code/meta
          curl -sf -X POST http://127.0.0.1:7999/api/code/scan \
            -H 'content-type: application/json' -d '{"root":"src"}'
          curl -sf http://127.0.0.1:7999/api/code/snippets
          curl -sf http://127.0.0.1:7999/api/diagnostics | grep -q summary
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"scan src"}'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"save snippet ci: echo ci"}'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"check src/App.tsx"}'
          curl -sf -X POST http://127.0.0.1:7999/api/code/review \
            -H 'content-type: application/json' \
            -d '{"code":"def f():\n    if a == None:\n        pass\n","language":"python"}' \
            | grep -q py-none-compare

  # The Windows installer is the deliverable, so it is built and verified on every push and PR.
  package-windows:
    name: Package Windows (installer + portable)
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx vite build

      - name: Package with electron-builder
        shell: bash
        env:
          DEBUG: electron-builder
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee ../electron-builder.log

      - name: Package contents
        shell: bash
        run: |
          ls -lh release/
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "::error::no installer produced"; exit 1; }

      # Roadmap item: prove the installer actually installs, not just builds.
      - name: Install silently and check the installed layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release/*.exe | Where-Object { $_.Name -notmatch 'portable' } | Select-Object -First 1
          if (-not $installer) { Write-Error "no NSIS installer found in release/"; exit 1 }
          Write-Host "installer: $($installer.FullName) ($([math]::Round($installer.Length/1MB,1)) MB)"

          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/currentuser' -PassThru
          $proc | Wait-Process -Timeout 300
          Write-Host "installer exited with code $($proc.ExitCode)"

          # NSIS can return before every file is on disk, so poll instead of trusting -Wait.
          $candidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\MAX'),
            (Join-Path $env:LOCALAPPDATA 'Programs\max'),
            $env:PROGRAMFILES + '\MAX',
            ${env:PROGRAMFILES(X86)} + '\MAX'
          ) | Where-Object { $_ }

          $root = $null
          for ($i = 0; $i -lt 30; $i++) {
            $root = $candidates | Where-Object { Test-Path (Join-Path $_ 'MAX.exe') } | Select-Object -First 1
            if ($root) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $root) {
            Write-Host "::group::where did it go?"
            $candidates | ForEach-Object { Write-Host "$_ -> $(Test-Path $_)" }
            Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "localappdata: $($_.Name)" }
            Get-ChildItem ([IO.Path]::GetTempPath()) -Filter '*.log' -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host "temp log: $($_.Name)" }
            Write-Host "::endgroup::"
            Write-Error "MAX.exe was not installed into any known location"
            exit 1
          }

          Write-Host "installed to $root"
          Get-ChildItem $root | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          $asar = Join-Path $root 'resources\app.asar'
          if (-not (Test-Path $asar)) { Write-Error "app.asar missing at $asar"; exit 1 }
          Write-Host ("app.asar: {0:N1} MB" -f ((Get-Item $asar).Length / 1MB))

          # The local service is unpacked outside the archive, or the app cannot start.
          $server = Join-Path $root 'resources\app.asar.unpacked\server\index.mjs'
          if (-not (Test-Path $server)) {
            Write-Host "::group::unpacked resources"
            Get-ChildItem (Join-Path $root 'resources') -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object -First 40 FullName | ForEach-Object { Write-Host $_.FullName }
            Write-Host "::endgroup::"
            Write-Error "the local service is missing from app.asar.unpacked"
            exit 1
          }

          $size = (Get-ChildItem $root -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("installed size: {0:N1} MB" -f $size)
          Write-Host "install layout OK"

      - name: Check the updater feed was produced
        shell: bash
        run: |
          ls release/*.yml || true
          test -f release/latest.yml || { echo "::error::electron-updater needs latest.yml"; exit 1; }

      - name: Uninstall the test copy
        if: always()
        shell: pwsh
        run: |
          $roots = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\MAX'),
            (Join-Path $env:LOCALAPPDATA 'Programs\max'),
            $env:PROGRAMFILES + '\MAX'
          ) | Where-Object { $_ }
          $found = $false
          foreach ($root in $roots) {
            $uninstaller = Join-Path $root 'Uninstall MAX.exe'
            if (Test-Path $uninstaller) {
              Write-Host "uninstalling from $root"
              Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
              $found = $true
            }
          }
          if (-not $found) { Write-Host "no uninstaller found - nothing to clean" }

      - name: Show log on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::electron-builder log"
          tail -n 200 ../electron-builder.log || true
          echo "::endgroup::"

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-log-windows
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-windows-x64
          path: |
            app/release/*.exe
            app/release/*.yml
          if-no-files-found: error
          retention-days: 30
