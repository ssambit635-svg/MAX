name: Build MAX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build UI
        run: npx vite build

      - name: Regenerate icons from source
        run: npm run icons

      - name: Integration verification logic
        run: npm run test:integrations

      - name: App allowlist and resolver logic
        run: npm run test:apps

      - name: Code engine rules and file guards
        run: npm run test:code

      - name: Editor syntax highlighting
        run: npm run test:highlight

      - name: Codebase housekeeping (dead CSS, dead exports, dead prefs)
        run: npm run test:codebase

      - name: Snippets, project scan and diagnostics
        run: npm run test:tools

      - name: Production gauntlet (hostile input, bad requests, corrupt state)
        run: npm run test:production

      - name: Smoke-test the local service
        run: |
          node server/index.mjs &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:7999/api/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7999/api/health
          curl -sf http://127.0.0.1:7999/ -o /dev/null -w 'ui %{http_code}\n'
          curl -sf http://127.0.0.1:7999/pet.html -o /dev/null -w 'pet %{http_code}\n'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"stats github"}'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"help"}'
          curl -sf -X POST http://127.0.0.1:7999/api/notes \
            -H 'content-type: application/json' -d '{"text":"ci smoke test"}'
          curl -sf http://127.0.0.1:7999/api/state > /dev/null
          curl -sf http://127.0.0.1:7999/api/code/meta
          curl -sf -X POST http://127.0.0.1:7999/api/code/scan \
            -H 'content-type: application/json' -d '{"root":"src"}'
          curl -sf http://127.0.0.1:7999/api/code/snippets
          curl -sf http://127.0.0.1:7999/api/diagnostics | grep -q summary
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"scan src"}'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"save snippet ci: echo ci"}'
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' -d '{"input":"check src/App.tsx"}'
          curl -sf -X POST http://127.0.0.1:7999/api/code/review \
            -H 'content-type: application/json' \
            -d '{"code":"def f():\n    if a == None:\n        pass\n","language":"python"}' \
            | grep -q py-none-compare

  # The Windows installer is the deliverable, so it is built and verified on every push and PR.
  package-windows:
    name: Package Windows (installer + portable)
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx vite build

      - name: Package with electron-builder
        shell: bash
        env:
          DEBUG: electron-builder
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee ../electron-builder.log

      - name: Package contents
        shell: bash
        run: |
          ls -lh release/
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "::error::no installer produced"; exit 1; }

      # Roadmap item: prove the installer actually installs, not just builds.
      # Every branch reports through an annotation, so a failure is readable from
      # the API even when the raw log is not reachable.
      - name: Install silently and check the installed layout
        shell: pwsh
        run: |
          function Say($level, $message) { Write-Host "::$level::$message" }

          $installer = Get-ChildItem release/*.exe | Where-Object { $_.Name -notmatch 'portable' } | Select-Object -First 1
          if (-not $installer) { Say error "no NSIS installer in release/"; exit 1 }
          Say notice ("installer {0} {1:N1} MB" -f $installer.Name, ($installer.Length / 1MB))

          $exit = 'unknown'
          try {
            $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/currentuser' -PassThru
            $proc.WaitForExit(300000) | Out-Null
            $exit = $proc.ExitCode
          } catch {
            Say warning "launching the installer threw: $($_.Exception.Message)"
          }
          Say notice "installer exit code: $exit"

          # Ask Windows where it went; guessing the path is how this check lied before.
          $locations = @()
          foreach ($hive in 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall') {
            $entries = Get-ChildItem $hive -ErrorAction SilentlyContinue |
              Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'MAX*' }
            foreach ($entry in $entries) {
              Say notice "registry: $($entry.DisplayName) -> $($entry.InstallLocation)"
              if ($entry.InstallLocation) { $locations += $entry.InstallLocation.Trim('"') }
            }
          }

          $fallbacks = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\MAX'),
            (Join-Path $env:LOCALAPPDATA 'Programs\max'),
            (Join-Path $env:ProgramFiles 'MAX')
          )
          foreach ($path in $fallbacks) { $locations += $path }

          $root = $null
          for ($i = 0; $i -lt 20 -and -not $root; $i++) {
            $root = $locations | Where-Object { $_ -and (Test-Path (Join-Path $_ 'MAX.exe')) } | Select-Object -First 1
            if (-not $root) { Start-Sleep -Seconds 2 }
          }

          if (-not $root) {
            foreach ($path in $locations) { Say warning "not here: $path exists=$(Test-Path $path)" }
            $apps = (Get-ChildItem $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
            Say error "MAX.exe was not found after install (localappdata dirs: $apps)"
            exit 1
          }

          Say notice "installed to $root"
          Say notice ("top level: " + ((Get-ChildItem $root | ForEach-Object { $_.Name }) -join ', '))

          $asar = Join-Path $root 'resources\app.asar'
          if (-not (Test-Path $asar)) { Say error "app.asar missing in $root"; exit 1 }
          Say notice ("app.asar {0:N1} MB" -f ((Get-Item $asar).Length / 1MB))

          # The local service is unpacked outside the archive, or the app cannot start.
          $server = Join-Path $root 'resources\app.asar.unpacked\server\index.mjs'
          if (-not (Test-Path $server)) {
            $listing = (Get-ChildItem (Join-Path $root 'resources') -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 25 | ForEach-Object { $_.FullName }) -join ' | '
            Say error "unpacked server missing. resources: $listing"
            exit 1
          }

          $size = (Get-ChildItem $root -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Say notice ("install layout OK - {0:N1} MB, exe + asar + unpacked service all present" -f $size)

      # The install check proves the files are there. This proves they run.
      - name: Launch the installed app and talk to it
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MAX\MAX.exe'
          if (-not (Test-Path $exe)) { Write-Host "::error::MAX.exe missing, cannot boot it"; exit 1 }
          $env:MAX_API_PORT = '47311'
          $proc = Start-Process -FilePath $exe -PassThru
          $health = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $health = Invoke-WebRequest -Uri 'http://127.0.0.1:47311/api/health' -UseBasicParsing -TimeoutSec 2
              if ($health.StatusCode -eq 200) { break }
            } catch { $health = $null }
            if ($proc.HasExited) { break }
          }
          if (-not $health -or $health.StatusCode -ne 200) {
            Write-Host "::error::the installed app never answered on /api/health (exit code: $($proc.ExitCode))"
            Get-Process MAX -ErrorAction SilentlyContinue | Stop-Process -Force
            exit 1
          }
          Write-Host "::notice::installed app booted and served $($health.Content)"
          $state = Invoke-WebRequest -Uri 'http://127.0.0.1:47311/api/state' -UseBasicParsing -TimeoutSec 15
          if ($state.Content -notmatch '"config"' -or $state.Content -notmatch '"stats"') {
            Write-Host "::error::/api/state is missing config or stats"
            exit 1
          }
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:47311/' -UseBasicParsing -TimeoutSec 10
          if ($page.StatusCode -ne 200) { Write-Host "::error::the island UI did not load ($($page.StatusCode))"; exit 1 }
          Write-Host "::notice::ui loaded, $(($state.Content.Length / 1KB)) KB of state, app still alive: $(-not $proc.HasExited)"
          Get-Process MAX -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
      - name: Check the updater feed was produced
        shell: bash
        run: |
          ls release/*.yml || true
          test -f release/latest.yml || { echo "::error::electron-updater needs latest.yml"; exit 1; }

      - name: Uninstall the test copy
        if: always()
        shell: pwsh
        run: |
          $roots = @((Join-Path $env:LOCALAPPDATA 'Programs\MAX'), (Join-Path $env:LOCALAPPDATA 'Programs\max'), (Join-Path $env:ProgramFiles 'MAX'))
          foreach ($hive in 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall') {
            Get-ChildItem $hive -ErrorAction SilentlyContinue | Get-ItemProperty -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like 'MAX*' -and $_.InstallLocation } |
              ForEach-Object { $roots += $_.InstallLocation.Trim('"') }
          }
          $roots = $roots | Where-Object { $_ } | Select-Object -Unique
          $found = $false
          foreach ($root in $roots) {
            $uninstaller = Join-Path $root 'Uninstall MAX.exe'
            if (Test-Path $uninstaller) {
              Write-Host "uninstalling from $root"
              Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
              $found = $true
            }
          }
          Get-Process MAX -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          if (-not $found) { Write-Host "no uninstaller found - nothing to clean" }

      - name: Show log on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::electron-builder log"
          tail -n 200 ../electron-builder.log || true
          echo "::endgroup::"

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-log-windows
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAX-windows-x64
          path: |
            app/release/*.exe
            app/release/*.yml
          if-no-files-found: error
          retention-days: 30
