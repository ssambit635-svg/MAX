name: Build MAX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'app/**'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build the island
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build UI
        run: npx vite build

      - name: Smoke-test the local service
        run: |
          node server/index.mjs &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7999/api/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7999/api/health
          curl -sf -X POST http://127.0.0.1:7999/api/command \
            -H 'content-type: application/json' \
            -d '{"input":"stats github"}'
          curl -sf -X POST http://127.0.0.1:7999/api/notes \
            -H 'content-type: application/json' \
            -d '{"text":"ci smoke test"}'
          curl -sf http://127.0.0.1:7999/api/state > /dev/null

  package:
    name: Package desktop app (${{ matrix.os }})
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: dist/*.exe
          - os: macos-latest
            artifacts: dist/*.dmg
          - os: ubuntu-latest
            artifacts: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx vite build

      - name: Package with electron-builder
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MAX-${{ matrix.os }}
          path: app/${{ matrix.artifacts }}
          if-no-files-found: warn
          retention-days: 30
