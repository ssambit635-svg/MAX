name: Package macOS and Linux

# Windows is the deliverable, and it is packaged on every push and PR by build.yml.
# macOS and Linux are nice-to-have, so they live here — on main and on demand only,
# which keeps them out of pull-request checks entirely. They never block a merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  package:
    name: Package ${{ matrix.name }} (best effort)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: npx electron-builder --mac --publish never
            artifact: MAX-macos
            files: |
              app/release/*.dmg
              app/release/*.zip
          - name: Linux
            os: ubuntu-latest
            command: npx electron-builder --linux --publish never
            artifact: MAX-linux
            files: app/release/*.AppImage
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx vite build

      - name: Package with electron-builder
        shell: bash
        env:
          DEBUG: electron-builder
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          ${{ matrix.command }} 2>&1 | tee ../electron-builder.log

      - name: Show log on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::electron-builder log"
          tail -n 200 ../electron-builder.log || true
          echo "::endgroup::"

      - name: Upload packaging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-log-${{ matrix.name }}
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: warn
          retention-days: 30
